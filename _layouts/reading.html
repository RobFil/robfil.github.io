---
layout: default
---
<link rel="stylesheet" href="{{ '/assets/css/reading.css' | relative_url }}">

<main class="reading-shell" aria-label="Lesetexte">
  {% if page.reading_time_minutes %}
    <article class="reading-article">
      <header class="reading-article-header">
        <p class="eyebrow">{{ page.topic | upcase }} // {{ page.level }} // {{ page.reading_time_minutes }} MIN</p>
        <h1>{{ page.title }}</h1>
      </header>
      <div class="reading-prose">{{ content }}</div>
    </article>
  {% else %}
    <header class="reading-index-header">
      <p class="eyebrow">日本語読解</p>
      <h1>{{ page.title }}</h1>
      <p>日常生活から仕事まで、さまざまなテーマで日本語を読むためのオリジナル教材です。</p>
    </header>
    <section class="reading-index">{{ content }}</section>
  {% endif %}
</main>
